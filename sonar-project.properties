# SonarQube Cloud project configuration (read by the "SonarQube Cloud scan" job in
# .github/workflows/ci.yaml; the scanner token comes from the SONAR_TOKEN repository secret).
#
# What is in this repository, and what Sonar can see of it:
#   * Go             wazuh_agent/ui/server: the status page's server, with coverage
#   * TypeScript/Vue wazuh_agent/ui/web/src: the status page, with coverage
#   * Python         scripts/ and tests/: analysed, with coverage
#   * Dockerfile     wazuh_agent/Dockerfile: analysed
#   * GitHub Actions .github/workflows: analysed
#   * Shell          the *.sh files are analysed; the s6 service scripts and the bin/ helpers have no
#                    file extension, so Sonar skips them (shellcheck covers them in CI instead)
#   * jq, JSON, YAML configuration: not analysed as code
# Coverage is enforced at 100% for Python, Go and the web code by scripts/ci/coverage.sh; shell and jq
# cannot be measured, and are covered by the render tests and the end-to-end tests instead.
sonar.projectKey=brianbaggs35_ha-wazuh-agent
sonar.organization=brianbaggs35
sonar.projectName=Wazuh Agent for Home Assistant
sonar.sourceEncoding=UTF-8

# Paths are relative to this file.
sonar.sources=wazuh_agent,scripts,.github/workflows
# Tests live apart (tests/) and next to the code (Go *_test.go, web *.spec.ts); sonar.test.inclusions
# says which files in these directories are tests, so their siblings stay classified as source.
sonar.tests=tests,wazuh_agent/ui/server,wazuh_agent/ui/web/src
sonar.test.inclusions=tests/**,**/*_test.go,**/*.spec.ts,wazuh_agent/ui/web/src/test/**

# Binary images (icon.png, logo.png) are not source code; scanning them as text produced the
# "problems with file encoding" warning. Dependencies and build output are not ours to analyse.
sonar.exclusions=**/__pycache__/**,**/*.png,**/node_modules/**,wazuh_agent/ui/web/dist/**,wazuh_agent/ui/web/coverage/**,**/package-lock.json
# Test fixtures are data (JSON options and expectations), not code.
sonar.test.exclusions=tests/fixtures/**
# Repetitive by nature: test scenarios and the per-option UI text.
sonar.cpd.exclusions=tests/**,**/*_test.go,**/*.spec.ts,wazuh_agent/translations/**

# Left out of the coverage figures because nothing here can be measured by these tools (shell, jq,
# YAML), or because it is test code or type declarations.
sonar.coverage.exclusions=tests/**,.github/**,wazuh_agent/rootfs/**,wazuh_agent/Dockerfile,wazuh_agent/translations/**,**/*_test.go,**/*.spec.ts,wazuh_agent/ui/web/src/test/**,wazuh_agent/ui/web/src/api/types.ts,wazuh_agent/ui/web/*.ts

sonar.python.version=3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.go.coverage.reportPaths=coverage-go/coverage.out
sonar.javascript.lcov.reportPaths=wazuh_agent/ui/web/coverage/lcov.info
sonar.typescript.tsconfigPaths=wazuh_agent/ui/web/tsconfig.app.json

# One deliberate exception. docker:S8431 asks for either the tag or the digest on the FROM line, not
# both. This project keeps both on purpose: Docker pulls by the digest (the tag is ignored), and
# the tag is what Dependabot needs to propose a newer digest and what a reader needs to see which
# release is pinned.
sonar.issue.ignore.multicriteria=dockerDigest
sonar.issue.ignore.multicriteria.dockerDigest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.dockerDigest.resourceKey=wazuh_agent/Dockerfile
