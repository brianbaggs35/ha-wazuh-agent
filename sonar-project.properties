# SonarQube Cloud project configuration (read by the "SonarQube Cloud scan" job in
# .github/workflows/ci.yaml; the scanner token comes from the SONAR_TOKEN repository secret).
#
# What is in this repository, and what Sonar can see of it:
#   * Python         scripts/ and tests/: analysed, with coverage from `coverage xml`
#   * Dockerfile     wazuh_agent/Dockerfile: analysed
#   * GitHub Actions .github/workflows: analysed
#   * Shell          the *.sh files are analysed; the s6 service scripts and the bin/ helpers have no
#                    file extension, so Sonar skips them (shellcheck covers them in CI instead)
#   * jq, JSON, YAML configuration: not analysed as code
sonar.projectKey=brianbaggs35_ha-wazuh-agent
sonar.organization=brianbaggs35
sonar.projectName=Wazuh Agent for Home Assistant
sonar.sourceEncoding=UTF-8

# Paths are relative to this file.
sonar.sources=wazuh_agent,scripts,.github/workflows
sonar.tests=tests

# Test fixtures are data (JSON options and expectations), not code.
sonar.test.exclusions=tests/fixtures/**
sonar.exclusions=**/__pycache__/**
# Repetitive by nature: test scenarios and the per-option UI text.
sonar.cpd.exclusions=tests/**,wazuh_agent/translations/**

# Only Python can be measured. Everything else would show as "uncovered" without meaning
# anything, so it is left out of the coverage figures.
sonar.coverage.exclusions=tests/**,wazuh_agent/**,.github/**
sonar.python.version=3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
