---
# Findings Trivy reports that are deliberate. CI passes this file with --ignorefile, so
# every other HIGH or CRITICAL finding fails the build. Each entry must say why, and
# vulnerability entries must carry an expiry date so they are looked at again.
vulnerabilities: []
misconfigurations:
  - id: DS-0002
    paths:
      - Dockerfile
    statement: >-
      Home Assistant apps start as root, and this one has to: it is the Wazuh agent of the Home
      Assistant OS device, runs its daemons that read protected files (file integrity, log
      collection, modules) inside the device's file system, and for that asks Home Assistant for
      the device's process namespace, network and host name and the SYS_PTRACE and SYS_ADMIN
      capabilities (the Security section of DOCS.md says what each is for, and why the Supervisor's
      security rating is therefore low). The one network-facing daemon, wazuh-agentd, drops to the
      unprivileged "wazuh" account by itself. No full access, no Docker API and no published
      ports are requested, and this app's AppArmor profile confines it. tests/config/check_config.py
      fails if anything beyond that reviewed list is ever requested.
