---
name: Release

# Publishing a GitHub release builds and publishes the app image. Home Assistant pulls the
# image tag that matches `version:` in wazuh_agent/config.yaml, so that is what gets tagged.
#
# The order is the point:
#   verify     the release is consistent (tag, config.yaml version, changelog) and the version
#              has not been published before
#   build      each architecture is built NATIVELY and pushed under a staging tag
#              (<version>-<arch>) that Home Assistant never pulls, then the exact pushed image
#              is tested (render tests, the full end-to-end suite against a real Wazuh manager)
#              and scanned (Trivy gate). Any failure stops the release here.
#   manifest   only now is the multi-arch tag (<version>, wazuh-<agent version>, latest) created,
#              and the image is signed (Sigstore keyless)
#   verify-published  what a user will actually pull is checked once more: platforms, labels,
#              signature, and an end-to-end run against the published tag
#
# A manual run is a rehearsal: it does everything except create the multi-arch tags.

"on":
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: "Also create the multi-arch tags (otherwise this is a rehearsal)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wazuh_agent
  TRIVY_VERSION: v0.76.0
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
  PYYAML_VERSION: "6.0.3"

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.facts.outputs.version }}
      wazuh_version: ${{ steps.facts.outputs.wazuh_version }}
      repo: ${{ steps.facts.outputs.repo }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the facts
        id: facts
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="$(sed -n 's/^version: "\(.*\)"$/\1/p' wazuh_agent/config.yaml)"
          wazuh_version="$(sed -n 's/^ARG WAZUH_VERSION=\(.*\)$/\1/p' wazuh_agent/Dockerfile)"
          repo="${REGISTRY}/${OWNER,,}/${IMAGE_NAME}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::config.yaml version '${version}' is not MAJOR.MINOR.PATCH"; exit 1; }
          [[ -n "${wazuh_version}" ]] || { echo "::error::could not read ARG WAZUH_VERSION from the Dockerfile"; exit 1; }

          # Supervisor pulls "<image>:<version>" using the image name from config.yaml.
          configured="$(sed -n 's/^image: \(.*\)$/\1/p' wazuh_agent/config.yaml)"
          [[ "${configured}" == "${repo}" ]] || { echo "::error::config.yaml image '${configured}' must be '${repo}'"; exit 1; }

          # The image is tagged from config.yaml, so a release cut from the wrong commit would
          # publish a different version than the one named on the release. Refuse that.
          if [[ "${EVENT}" == "release" && "${RELEASE_TAG}" != "${version}" && "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match config.yaml version '${version}'. Re-cut the release from a commit whose config.yaml says ${version}."
            exit 1
          fi

          # The changelog entry must exist and must not still say "unreleased".
          heading="$(grep -E "^## \[${version//./\\.}\]" wazuh_agent/CHANGELOG.md | head -n 1 || true)"
          [[ -n "${heading}" ]] || { echo "::error::wazuh_agent/CHANGELOG.md has no entry for ${version}"; exit 1; }
          if [[ "${heading}" == *nreleased* ]]; then
            if [[ "${EVENT}" == "release" ]]; then
              echo "::error::The changelog entry for ${version} is still marked unreleased: ${heading}"
              exit 1
            fi
            echo "::warning::The changelog entry for ${version} is still marked unreleased (allowed for a rehearsal)."
          fi

          {
            echo "version=${version}"
            echo "wazuh_version=${wazuh_version}"
            echo "repo=${repo}"
          } >> "${GITHUB_OUTPUT}"

      - name: Config guard
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet "pyyaml==${PYYAML_VERSION}"
          "${RUNNER_TEMP}/venv/bin/python" -I tests/config/check_config.py

      - name: Refuse to overwrite a published version
        env:
          REPO: ${{ steps.facts.outputs.repo }}
          VERSION: ${{ steps.facts.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "${GH_TOKEN}" | docker login "${REGISTRY}" -u "${ACTOR}" --password-stdin
          if docker manifest inspect "${REPO}:${VERSION}" > /dev/null 2>&1; then
            echo "::error::${REPO}:${VERSION} is already published. Bump the version in config.yaml and the changelog instead."
            exit 1
          fi

  build:
    name: Build, test and scan (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      REPO: ${{ needs.verify.outputs.repo }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      # Staging tag: Home Assistant never pulls "<version>-<arch>". Provenance attestations are
      # off here because they would wrap the image in an index and make the staging tag
      # ambiguous; the signed multi-arch manifest is what users verify.
      - name: Build and push (staging tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: wazuh_agent
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REPO }}:${{ env.VERSION }}-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ steps.date.outputs.value }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: The exact image under test
        id: ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image=${REPO}@${DIGEST}" >> "${GITHUB_OUTPUT}"
          docker pull "${REPO}@${DIGEST}"
          # The tests refer to the image by a plain tag; point one at the digest we just pushed.
          docker tag "${REPO}@${DIGEST}" "release-candidate:${{ matrix.arch }}"

      - name: Render tests
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet "pyyaml==${PYYAML_VERSION}"
          PATH="${RUNNER_TEMP}/venv/bin:${PATH}" IMAGE="release-candidate:${{ matrix.arch }}" tests/render/run.sh

      - name: End-to-end tests against a real Wazuh manager
        run: IMAGE="release-candidate:${{ matrix.arch }}" tests/e2e/run.sh

      - name: Trivy gate - fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ steps.ref.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: "1"

      - name: Trivy report - MEDIUM and above, as SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ steps.ref.outputs.image }}
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: "true"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-release-${{ matrix.arch }}.sarif
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload the report to code scanning
        if: always()
        continue-on-error: true  # code scanning may be unavailable
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: trivy-release-${{ matrix.arch }}.sarif
          category: trivy-release-${{ matrix.arch }}

      - name: Software bill of materials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ steps.ref.outputs.image }}
          format: cyclonedx
          output: sbom-${{ matrix.arch }}.cdx.json
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: sbom-${{ matrix.arch }}.cdx.json
          retention-days: 90

  manifest:
    name: Publish the multi-arch image
    needs: [verify, build]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REPO: ${{ needs.verify.outputs.repo }}
      VERSION: ${{ needs.verify.outputs.version }}
      WAZUH_VERSION: ${{ needs.verify.outputs.wazuh_version }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch tags
        id: manifest
        run: |
          amd64="$(docker buildx imagetools inspect "${REPO}:${VERSION}-amd64" --format '{{.Manifest.Digest}}')"
          arm64="$(docker buildx imagetools inspect "${REPO}:${VERSION}-aarch64" --format '{{.Manifest.Digest}}')"
          echo "amd64=${amd64}  aarch64=${arm64}"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=Wazuh Agent for Home Assistant" \
            --annotation "index:org.opencontainers.image.description=Wazuh ${WAZUH_VERSION} agent packaged as a Home Assistant app" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            -t "${REPO}:${VERSION}" \
            -t "${REPO}:wazuh-${WAZUH_VERSION}" \
            -t "${REPO}:latest" \
            "${REPO}@${amd64}" "${REPO}@${arm64}"
          digest="$(docker buildx imagetools inspect "${REPO}:${VERSION}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign the image (Sigstore keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${REPO}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App version | \`${VERSION}\` |"
            echo "| Wazuh agent | \`${WAZUH_VERSION}\` |"
            echo "| Image | \`${REPO}:${VERSION}\` |"
            echo "| Digest | \`${DIGEST}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  verify-published:
    name: Verify what users pull (${{ matrix.arch }})
    needs: [verify, manifest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: read
    env:
      REPO: ${{ needs.verify.outputs.repo }}
      VERSION: ${{ needs.verify.outputs.version }}
      WAZUH_VERSION: ${{ needs.verify.outputs.wazuh_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The tag lists both platforms
        run: |
          platforms="$(docker buildx imagetools inspect "${REPO}:${VERSION}" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.architecture != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")')"
          echo "platforms: ${platforms}"
          [[ "${platforms}" == "linux/amd64,linux/arm64" ]] || { echo "::error::expected linux/amd64 and linux/arm64, got ${platforms}"; exit 1; }

      - name: Pull the published tag
        run: docker pull --platform "${{ matrix.platform }}" "${REPO}:${VERSION}"

      - name: Labels match the release
        run: |
          label() { docker image inspect "${REPO}:${VERSION}" --format "{{ index .Config.Labels \"$1\" }}"; }
          [[ "$(label io.hass.type)" == "app" ]] || { echo "::error::io.hass.type is not 'app'"; exit 1; }
          [[ "$(label io.hass.version)" == "${VERSION}" ]] || { echo "::error::io.hass.version is '$(label io.hass.version)', expected ${VERSION}"; exit 1; }
          [[ "$(label com.wazuh.agent.version)" == "${WAZUH_VERSION}" ]] || { echo "::error::agent version label mismatch"; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: The signature verifies
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${REPOSITORY}/\.github/workflows/release\.yaml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REPO}:${VERSION}" > /dev/null

      - name: End-to-end tests of the published tag
        run: IMAGE="${REPO}:${VERSION}" tests/e2e/run.sh enroll journal fim password
