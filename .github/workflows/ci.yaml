---
name: CI

# What runs, and why each part exists:
#   lint          static checks: YAML, shell, Dockerfile, workflows, AppArmor syntax, the Home
#                 Assistant app linter, and the config guard (options, translations, security rating)
#   build         the image is built once; every later job tests exactly these bits
#   render-tests  the configuration renderer, with every Wazuh daemon checking its output
#   e2e           the image against a REAL Wazuh manager: enrollment, persistence, journal, file
#                 integrity, passwords. amd64 against two manager versions, and arm64 natively
#                 (the Raspberry Pi architecture)
#   trivy         vulnerability, misconfiguration and secret scans plus an SBOM
# A nightly run catches new CVEs and new Wazuh or base-image releases without a code change.

"on":
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Built and loaded within this run only, never pushed. Not named "test-*": Trivy's SARIF puts
  # the image name in the result path and GitHub classifies results under "test" paths as test code.
  IMAGE: ci-wazuh-agent:${{ github.sha }}
  TRIVY_VERSION: v0.75.0
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
  PYYAML_VERSION: "6.0.3"

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: YAML
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet "yamllint==1.38.0" "pyyaml==${PYYAML_VERSION}"
          "${RUNNER_TEMP}/venv/bin/yamllint" -c .yamllint --strict .

      - name: Shell scripts
        run: |
          shopt -s nullglob
          shellcheck -x \
            tests/e2e/run.sh tests/e2e/lib/*.sh tests/render/*.sh \
            wazuh_agent/rootfs/usr/local/bin/* \
            wazuh_agent/rootfs/etc/s6-overlay/s6-rc.d/*/run \
            wazuh_agent/rootfs/etc/s6-overlay/s6-rc.d/*/finish \
            scripts/*.sh

      - name: Dockerfile
        run: |
          docker run --rm -v "${PWD}:/w:ro" hadolint/hadolint:v2.14.0 \
            hadolint --config /w/.hadolint.yaml /w/wazuh_agent/Dockerfile

      - name: Workflows
        run: docker run --rm -v "${PWD}:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

      - name: AppArmor profile syntax
        run: |
          docker run --rm -v "${PWD}/wazuh_agent/apparmor.txt:/profiles/wazuh_agent:ro" \
            debian:trixie-slim bash -euc '
              apt-get update -qq > /dev/null
              apt-get install -y -qq apparmor > /dev/null
              apparmor_parser -Q -K -T /profiles/wazuh_agent'

      - name: Config guard (options, translations, security rating)
        run: |
          "${RUNNER_TEMP}/venv/bin/python" -I tests/config/check_config.py

      - name: Unit tests (version update script)
        run: python3 -I -m unittest discover -s tests/scripts -v

      - name: Home Assistant app linter
        uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7  # v2.21.1
        with:
          path: ./wazuh_agent

  build:
    name: Build image (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build arguments
        id: args
        run: |
          echo "version=$(sed -n 's/^version: "\(.*\)"$/\1/p' wazuh_agent/config.yaml)" >> "${GITHUB_OUTPUT}"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: wazuh_agent
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            BUILD_VERSION=${{ steps.args.outputs.version }}
            BUILD_DATE=${{ steps.args.outputs.date }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Save the image for the jobs that test it
        run: docker save "${IMAGE}" | gzip -1 > "${RUNNER_TEMP}/image.tar.gz"

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1
          compression-level: 0

  render-tests:
    name: Render tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Get the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}

      - name: Load the image
        run: gunzip -c "${RUNNER_TEMP}/image.tar.gz" | docker load

      - name: Render tests
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet "pyyaml==${PYYAML_VERSION}"
          PATH="${RUNNER_TEMP}/venv/bin:${PATH}" tests/render/run.sh

  e2e:
    name: E2E amd64 (manager ${{ matrix.manager }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The current manager, and the previous patch release: the agent may be newer than its
        # manager by a patch, which is the common state while a manager upgrade lags behind.
        manager: ["4.14.9", "4.14.8"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Get the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}

      - name: Load the image
        run: gunzip -c "${RUNNER_TEMP}/image.tar.gz" | docker load

      - name: End-to-end tests
        run: MANAGER_VERSION="${{ matrix.manager }}" tests/e2e/run.sh

  e2e-arm64:
    name: E2E arm64 (native)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: "Build (arm64, on an arm64 runner - no emulation)"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: wazuh_agent
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            BUILD_VERSION=ci
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Render tests
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet "pyyaml==${PYYAML_VERSION}"
          PATH="${RUNNER_TEMP}/venv/bin:${PATH}" tests/render/run.sh

      - name: End-to-end tests
        run: tests/e2e/run.sh

  trivy:
    name: Trivy scans
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Get the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}

      - name: Load the image
        run: gunzip -c "${RUNNER_TEMP}/image.tar.gz" | docker load

      # The gate: any HIGH or CRITICAL finding that has a fix fails the build. Findings without
      # a fix cannot be acted on, so they are reported (below) but do not block. Deliberate
      # exceptions live in .trivyignore.yaml with a reason and an expiry date.
      - name: Gate - fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: "1"

      - name: Report - MEDIUM and above, as SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: "true"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload the report to code scanning
        if: always()
        continue-on-error: true  # code scanning may be unavailable (forks, private repos without it)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Configuration scan (Dockerfile, config)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: wazuh_agent
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: "1"
          skip-setup-trivy: true

      - name: Secret scan (repository)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          skip-setup-trivy: true

      - name: Software bill of materials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  # One required status for branch protection: green only if everything above is.
  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, build, render-tests, e2e, e2e-arm64, trivy]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          if echo "${RESULTS}" | grep -Eq 'failure|cancelled|skipped'; then
            echo "::error::One or more jobs did not succeed."
            exit 1
          fi
