---
version: 2
updates:
  # Every GitHub Action is pinned to a commit SHA; Dependabot proposes the new SHA and
  # keeps the version comment next to it up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # The Home Assistant base image is pinned by digest in the Dockerfile.
  - package-ecosystem: docker
    directory: /wazuh_agent
    schedule:
      interval: weekly

  # The status page's Go module (standard library only today, but kept watched).
  - package-ecosystem: gomod
    directory: /wazuh_agent/ui/server
    schedule:
      interval: weekly

  # The status page's npm dependencies. Updates to the major version of the UI framework are left
  # to a person: they can change how the page looks and behaves.
  - package-ecosystem: npm
    directory: /wazuh_agent/ui/web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types:
          - minor
          - patch
